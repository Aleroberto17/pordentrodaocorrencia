<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok · Por Dentro da Ocorrência</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; display:grid; place-items:center; min-height:100vh; background:#0b0c0e; color:#e7eaee;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:32rem; padding:2rem 1.5rem; text-align:center; }
  p { color:#c3c8cf; }
  code { display:block; margin-top:1rem; padding:.6rem; background:#15171a; border-radius:.4rem; word-break:break-all; font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:1.2rem">Autorização do TikTok</h1>
  <p id="msg">Voltando pro painel da fábrica…</p>
  <code id="cod" hidden></code>
</main>
<script>
  // Ponte do login do TikTok (05/10/2026): o TikTok só devolve pra endereço https, e o painel
  // roda no computador do criador. Esta página repassa o código pro painel local.
  var q = location.search;
  var p = new URLSearchParams(q);
  if (p.get("error")) {
    document.getElementById("msg").textContent = "O TikTok recusou a autorização: " + (p.get("error_description") || p.get("error"));
  } else if (p.get("code")) {
    document.getElementById("cod").textContent = location.href;
    document.getElementById("cod").hidden = false;
    document.getElementById("msg").textContent =
      "Voltando pro painel. Se ele não abrir, copie o endereço abaixo e cole na seção TikTok da aba Instagram.";
    location.replace("http://localhost:3000/api/tiktok/callback" + q);
  } else {
    document.getElementById("msg").textContent = "Esta página só serve de retorno da autorização do TikTok.";
  }
</script>
</body>
</html>
